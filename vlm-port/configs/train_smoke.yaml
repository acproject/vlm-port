# Smoke: 1 optimizer step + final val on 4 samples, verifies GPU fp16 path end-to-end
qwen_model_dir: /home/acproject/usb/transplant/Qwen3.8-27B
llm_model_dir: /home/acproject/usb/transplant/Nanbeige4.3-33B

train_manifest: data/train_manifest.jsonl
val_manifest: data/val_manifest.jsonl
image_dir: data

device: cuda
dtype: float16
projector_dtype: float32
use_fa_v100: false

batch_size: 1
gradient_accumulation_steps: 2
epochs: 1
max_steps: 1
learning_rate: 2.0e-5
warmup_steps: 1
weight_decay: 0.01
max_grad_norm: 1.0
seed: 42

projector_act_fn: gelu
projector_use_input_norm: true

save_dir: checkpoints/smoke
save_interval: 1000
eval_interval: 1000
log_interval: 1
num_threads: 8
