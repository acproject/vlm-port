# Stage 1 v2 — anti-shortcut data recipe (3× V100-SXM2-32GB, bf16)
# Qwen3.8 Vision Tower (frozen, fp32) → Custom Projector (train, fp32, RMSNorm in) → Nanbeige4.3-33B (frozen, sharded)
#
# v1 postmortem (314 samples, VAL plateau 9.1132):
#   mm loss per-sample variance ≈ 0 + projector cross-image cos 0.993 → shortcut
#   learning; single-word answers over tiny answer spaces made the answer
#   marginal distribution worth 9.11 with zero visual information.
#   Native Qwen on the same vision features: ~98% semantic accuracy → data
#   was the bottleneck, not the features.
# v2 data (data/*_manifest_v2.jsonl, 3000/200):
#   caption 40% (long answers, expensive to guess blind) / joint 25% (answers =
#   f(2 attributes), incl. conditional counting) / single 25% (24 colors, 64
#   words, 80% short 20% full) / either-or 10% (visual binding, distractor random)
# Training: from-scratch projector (no init from v1 — avoid shortcut residue),
#   lr 5e-5 (RMSNorm in place; 2e-4 probe was stable but no gain on v1 data),
#   2 epochs = 750 optimizer steps ≈ 9h.

qwen_model_dir: /home/acproject/usb/transplant/Qwen3.8-27B
llm_model_dir: /home/acproject/usb/transplant/Nanbeige4.3-33B

# ── Data ──
train_manifest: data/train_manifest_v2.jsonl
val_manifest: data/val_manifest_v2.jsonl
image_dir: data
max_text_length: 4096

# ── Device / precision ──
# bf16 (emulated on Volta, 4.6x slower than fp16 but numerically required):
# fp16 backward underflows CE gradients to 0 through 52 layers (measured:
# GradScaler scale 65536→0, gnorm=0, flat loss). bf16 verified: grad=54.75 finite.
device: cuda
dtype: bfloat16
projector_dtype: float32

# ── Attention: PyTorch SDPA efficient backend wins at our lengths on Volta
#    (fa_v100 verified numerically but slower: 0.58 vs 0.46 s/iter @ S=100) ──
use_fa_v100: false

# ── Training (sharded_llm_forward requires batch_size=1, unpadded causal) ──
batch_size: 1
gradient_accumulation_steps: 8
epochs: 2                 # 3000 samples × 2 / 8 = 750 optimizer steps
max_steps: 750
max_minutes: 690
learning_rate: 5.0e-5
weight_decay: 0.01
warmup_steps: 50
max_grad_norm: 1.0
seed: 42

# ── Projector ──
projector_act_fn: gelu
projector_use_input_norm: true

# ── Logging / checkpoints ──
save_dir: checkpoints/stage1_v2
save_interval: 50
eval_interval: 25
log_interval: 5
log_file: logs/stage1_v2.log
log_micro: false
num_threads: 8
